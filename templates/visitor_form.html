<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THDC Visitor Form</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>THDC Visitor Form</h1>
    </header>

    <div class="form-card">
        <p class="subtitle">Please fill in your details below</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label for="name">👤 Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>

            <label for="phone">📱 Mobile Number</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter 10-digit mobile number"
                   pattern="[0-9]{10}" maxlength="10" inputmode="numeric"
                   title="Mobile number must be exactly 10 digits"
                   oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10)" required>

            <label for="email">✉️ Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email address" required>

            <label for="reason">📌 Reason to Visit</label>
            <input type="text" id="reason" name="reason" placeholder="Purpose of your visit" required>

            <p class="note">
                🕒 Date & time of your visit will be recorded automatically.
            </p>

            <button type="submit">Submit</button>
        </form>

        <p class="footer-link">
            <a href="{{ url_for('auth.login') }}">Admin Login →</a>
        </p>
    </div>
</body>
</html>
