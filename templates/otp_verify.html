<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP - THDC</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>THDC Visitor Form</h1>
    </header>

    <div class="form-card login-card">
        <div class="form-card-icon">📲</div>
        <h2>Verify Mobile Number</h2>
        <p class="subtitle">Enter the OTP sent to {{ phone }}</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label for="otp">🔢 Enter OTP</label>
            <input type="text" id="otp" name="otp" placeholder="6-digit OTP"
                   pattern="[0-9]{6}" maxlength="6" inputmode="numeric"
                   oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 6)" required autofocus>

            <button type="submit">Verify OTP</button>
        </form>

        <p class="footer-link">
            <a href="{{ url_for('visitor.resend_otp') }}">Resend OTP</a>
            &nbsp;|&nbsp;
            <a href="{{ url_for('visitor.visitor_form') }}">← Back to Form</a>
        </p>
    </div>
</body>
</html>
